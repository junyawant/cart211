    <meta name="description" content="A Humans of New York story. Course exercise (CART 211) exploring semantic HTML, CSS grid and accessible media presentation">

    <!-- Open Graph metadata controls how the page looks when shared on Social Media -->
     <meta property="og:type" content="article">
     <meta property="og:title" content="Humans of New York">
     <meta property="og:description" content="A Humans of New York story for CART 211">

     <!-- The page URL and Image used in Social Media previews -->
     <!-- PLACE HOLDERS, REPLACE LATER -->

     <meta property="og:image" content="https:hybrid.concordia.ca/btodd/humans/assets/amercia_pageant_og.jpg">

     <!-- The dimensions and alternative description of the preview -->
     <meta property="og:image:width" content="1200">
     <meta property="og:image:height" content="630">
     <meta property="og:image:alt" content="Portrait associated with the America Pageanr Story">

     <!-- X(Twitter) card metadata controls the appearance of sharedd links on X -->
     <!-- PLACE HOLDERS, REPLACE LATER -->
     <meta name="twitter:card" content="summary_large_image">
     <meta name="twitter:title" content="A Humans of New York story for CART 211">
     <meta name="twitter:description" content="A Humans of New York story for CART 211">
     <meta name="twitter:image" content="https:hybrid.concordia.ca/btodd/humans/assets/amercia_pageant_og.jpg">

     <!-- Identifies the prefered URL for this page to search engine  -->
